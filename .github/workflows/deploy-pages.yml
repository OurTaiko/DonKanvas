name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Verify public dependency sources
        run: node --test tests/deployment.test.js

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Build
        env:
          VITE_ONEDRIVE_CLIENT_ID: 68300dbc-b11e-4131-af28-2463c375b832
          VITE_GOOGLE_CLIENT_ID: 707073593802-idq0vkvqif7f2r2lf36lmo5md0hv2cpr.apps.googleusercontent.com
          VITE_GOOGLE_API_KEY: AIzaSyBCbZkfq6KazJmuTZuG6qldrJeiT3f2Rqk
          VITE_GOOGLE_APP_ID: 707073593802
          VITE_DROPBOX_CLIENT_ID: dvda5ci0x0hzb6v
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
